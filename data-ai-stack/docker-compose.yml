name: data-ai-stack

# Variables compartidas por todo lo que se conecta al Data Warehouse (SQL Server / SSIS)
x-dw-env: &dw-env
  DW_HOST: ${DW_HOST}
  DW_PORT: ${DW_PORT:-1433}
  DW_DATABASE: ${DW_DATABASE}
  DW_USER: ${DW_USER}
  DW_PASSWORD: ${DW_PASSWORD}
  DW_DRIVER: ${DW_DRIVER:-ODBC Driver 18 for SQL Server}
  DW_ENCRYPT: ${DW_ENCRYPT:-yes}
  DW_TRUST_SERVER_CERTIFICATE: ${DW_TRUST_SERVER_CERTIFICATE:-yes}
  MLFLOW_TRACKING_URI: http://mlflow:5000

services:
  # ------------------------------------------------------------------
  # Backend store de MLflow (experimentos, runs, metricas, registry)
  # ------------------------------------------------------------------
  mlflow-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER:-mlflow}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow}
      POSTGRES_DB: ${MLFLOW_DB_NAME:-mlflow}
    volumes:
      - mlflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_DB_USER:-mlflow} -d ${MLFLOW_DB_NAME:-mlflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [stack]

  # ------------------------------------------------------------------
  # MLflow Tracking Server + Model Registry + artifact proxy
  # ------------------------------------------------------------------
  mlflow:
    build: ./mlflow
    image: data-ai-stack/mlflow:latest
    restart: unless-stopped
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow}@mlflow-db:5432/${MLFLOW_DB_NAME:-mlflow}
      MLFLOW_ARTIFACTS_DESTINATION: /mlflow/artifacts
      MLFLOW_WORKERS: ${MLFLOW_WORKERS:-2}
      # Hosts aceptados en el header Host (proteccion DNS-rebinding de MLflow 3). Agrega aqui el hostname/IP con el que abras la UI.
      MLFLOW_ALLOWED_HOSTS: ${MLFLOW_ALLOWED_HOSTS:-localhost,127.0.0.1,mlflow,mlflow:*,host.docker.internal,10.*,172.*,192.168.*}
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
      - ./logs/mlflow:/mlflow/logs
    depends_on:
      mlflow-db:
        condition: service_healthy
    networks: [stack]

  # ------------------------------------------------------------------
  # JupyterLab con driver ODBC para el DW y cliente MLflow
  # ------------------------------------------------------------------
  jupyter:
    build: ./jupyter
    image: data-ai-stack/jupyter:latest
    restart: unless-stopped
    environment:
      <<: *dw-env
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-changeme}
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./src:/home/jovyan/src
      - ./sql:/home/jovyan/sql
      - ./logs/jupyter:/home/jovyan/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mlflow:
        condition: service_healthy
    networks: [stack]

  # ------------------------------------------------------------------
  # Runner de jobs batch. No arranca por defecto:
  #   docker compose run --rm jobs python -m src.jobs.smoke_test
  # ------------------------------------------------------------------
  jobs:
    build: ./jobs
    image: data-ai-stack/jobs:latest
    profiles: [jobs]
    environment:
      <<: *dw-env
      LOG_DIR: /app/logs
    volumes:
      - ./src:/app/src:ro
      - ./sql:/app/sql:ro
      - ./logs/jobs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mlflow:
        condition: service_healthy
    networks: [stack]

  # ------------------------------------------------------------------
  # SQL Server local para desarrollo (si no tienes acceso al DW real).
  # Arranca solo con:  docker compose --profile local-dw up -d
  # Luego en .env: DW_HOST=dw  DW_USER=sa  DW_PASSWORD=<MSSQL_SA_PASSWORD>
  # ------------------------------------------------------------------
  dw:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: [local-dw]
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - dw_data:/var/opt/mssql
      - ./sql:/sql:ro
    networks: [stack]

volumes:
  mlflow_db:
  mlflow_artifacts:
  dw_data:

networks:
  stack:
    driver: bridge
